<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Infinite Animes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<script>
/* Weak phone? (2 GB RAM or less, 4 cores or less, data saver, 2G) -> light mode: no blur, no shadows, smaller images */
(function () { try {
  var n = navigator, c = n.connection || {};
  var lite = (n.deviceMemory && n.deviceMemory <= 2) || (n.hardwareConcurrency && n.hardwareConcurrency <= 4) || c.saveData === true || /(^|-)2g$/.test(c.effectiveType || '');
  if (lite) document.documentElement.className += ' lite';
} catch (e) {} })();
</script>
<style>
:root{
  --bg:#000; --panel:#111; --panel2:#1a1a1a; --line:#2a2a2a; --text:#fff; --dim:#9a9a9a; --on:#000;
  --pad:16px; --r:12px;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font)}
body{min-height:100vh;overscroll-behavior-y:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
#app{max-width:760px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* header */
.logo{display:flex;align-items:center;gap:10px;padding:16px var(--pad) 8px}
.mark{width:36px;height:36px;border-radius:10px;background:#fff;color:#000;display:grid;place-items:center}
.mark svg{width:24px;height:24px}
.wm{font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo .sbtn{margin-left:auto;width:42px;height:42px;border-radius:999px;background:var(--panel);display:grid;place-items:center}
.logo .sbtn svg{width:20px;height:20px}

/* language picker */
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px var(--pad) 0}
.lang{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;text-align:center;min-height:52px}
.lang b{display:block;font-size:13px;font-weight:700}
.lang small{display:block;color:var(--dim);font-size:11px;line-height:1.3}

/* hero */
.hero{position:relative;margin:16px var(--pad) 0;border-radius:16px;overflow:hidden;min-height:200px;display:flex;align-items:flex-end;background:var(--panel)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.92))}
.hero .in{position:relative;z-index:1;padding:16px}
.hero .tag{color:var(--dim);font-size:13px;font-weight:600}
.hero h1{margin:2px 0 10px;font-size:24px;line-height:1.1;font-weight:800}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15px}
.btn.white{background:#fff;color:#000}
.btn.dark{background:var(--panel2);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.35}

/* section heading */
.sh{display:flex;align-items:center;gap:10px;padding:24px var(--pad) 12px}
.sh h2{margin:0;font-size:21px;font-weight:800;line-height:1.1}
.sh .bar{width:4px;height:22px;border-radius:4px;background:#fff}
.sh .more{margin-left:auto;color:var(--dim);font-size:14px;font-weight:600;padding:6px 0 6px 10px}

/* poster grid + strip */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;padding:0 var(--pad)}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip{display:flex;gap:12px;overflow-x:auto;padding:0 var(--pad);scroll-padding-inline:var(--pad);scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{width:112px;flex:none;scroll-snap-align:start}
.card{display:flex;flex-direction:column;align-self:flex-start;min-width:0;text-align:center}
.pimg{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--panel)}
.pimg img,.th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.pimg img.ok,.th img.ok{opacity:1}
.pimg .fb{position:absolute;inset:0;display:grid;place-items:center;padding:8px;font-size:13px;font-weight:700;color:var(--dim)}
.pimg .badge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.8);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:1}
.card .t{font-size:13px;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip small{color:var(--dim);margin-left:5px;font-weight:500}
.chip.on small{color:#555}

/* page heading */
.ph{padding:20px var(--pad) 14px}
.ph h1{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:4px;height:26px;border-radius:4px;background:#fff}
.ph p{margin:4px 0 0 14px;color:var(--dim);font-size:14px}
.sorts{margin-bottom:16px}
.sentinel{height:60px}

/* search */
.searchbar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);padding:12px var(--pad)}
.sbar{display:flex;align-items:center;gap:10px;width:calc(100% - 2*var(--pad));margin:14px var(--pad) 0;height:48px;border:1.5px solid #fff;border-radius:999px;padding:0 18px;color:var(--dim);font:500 16px var(--font);text-align:left}
.sbar svg{width:20px;height:20px;flex:none;color:#fff}
.sbox{display:flex;align-items:center;gap:10px;height:48px;border:1.5px solid #fff;border-radius:999px;padding:0 18px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 16px var(--font)}
.sbox input::placeholder{color:var(--dim)}
.sbox svg{width:20px;height:20px;flex:none}

/* title page */
.tpage{position:relative;overflow-x:hidden}
.tbg{position:absolute;top:0;left:0;right:0;height:380px;background:center 30%/cover no-repeat;opacity:.35;filter:blur(14px);transform:scale(1.1)}
.tbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),#000 95%)}
.tposter{position:relative;width:170px;margin:28px auto 0;box-shadow:0 16px 40px rgba(0,0,0,.7)}
.ttl{position:relative;text-align:center;font-size:24px;font-weight:800;line-height:1.15;margin:16px var(--pad) 14px}
.two{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 var(--pad)}
.ob{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px}
.ob.white{background:#fff;color:#000;border-color:#fff}
.ob svg{width:18px;height:18px;flex:none}
.ob span{display:flex;flex-direction:column;text-align:left;line-height:1.25}
.ob b{font-size:14px}.ob small{font-size:12px;opacity:.7}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:14px var(--pad) 0}
.pills span{background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:#ddd}
.box{margin:14px var(--pad) 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 6px;font-size:17px;font-weight:800}
.box p{margin:0;color:#c8c8c8;font-size:14px;line-height:1.6}
.box p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rm{font-weight:700;font-size:14px;padding:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{border:1px solid #444;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.box h4{margin:14px 0 0;font-size:14px;font-weight:700}
.seasons{padding-top:18px}
.season{flex:none;height:44px;padding:0 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--dim);white-space:nowrap}
.season.on{color:#fff;border-color:#fff}
.season small{font-weight:500;margin-left:4px}

/* episodes grid */
.eps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;padding:14px var(--pad) 0}
@media (min-width:560px){.eps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ep{text-align:left;min-width:0;display:flex;flex-direction:column;align-self:flex-start}
.th{position:relative;width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--panel)}
.th .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.8);font-size:12px;font-weight:800;padding:2px 7px;border-radius:5px;z-index:1}
.ep .et{font-size:12px;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.off{opacity:.35}
.ep.now .th{outline:2px solid #fff;outline-offset:-2px}
.note{color:var(--dim);font-size:14px;padding:12px var(--pad) 0;margin:0}
.relink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--fg,#fff);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* player */
.player{position:sticky;top:0;z-index:15;background:#000}
.player .stage{position:relative}
.player .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .wait{position:absolute;inset:0;z-index:2;display:grid;place-items:center;align-content:center;gap:12px;color:#ddd;font-size:14px;font-weight:600;background:#000;pointer-events:none;transition:opacity .3s}
.player .wait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.player .wait .spin,.player .wait span{position:relative}
.player .wait .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
.player .wait.gone{opacity:0}
.player .wait.gone .spin{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.fsbtn{position:absolute;right:8px;top:8px;z-index:3;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.55);display:grid;place-items:center}
.fsbtn svg{width:20px;height:20px}
.fsbar{display:none}
/* full screen: poori screen, portrait phone pe 90 degree ghuma ke landscape */
.player.fs{position:fixed;inset:0;z-index:100;background:#000}
.player.fs .stage{position:absolute;left:50%;top:50%;transform-origin:center center}
.player.fs .frame{aspect-ratio:auto;width:100%;height:100%}
.player.fs iframe{inset:auto}
.player.fs .fsbtn{display:none}
.player.fs .fsbar{display:flex;gap:8px;position:absolute;right:12px;top:12px;z-index:3;transition:opacity .3s}
.player.fs .fsbar.dim{opacity:.25}
.fsbar button{height:38px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.fsbar svg{width:16px;height:16px}
body.lock{overflow:hidden}
.pinfo{padding:14px var(--pad) 0}
.pinfo h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.pinfo .lbl{color:var(--dim);font-size:14px;margin-top:3px}
.ctrl{display:flex;gap:10px;margin:14px var(--pad) 0}
.ctrl .btn{flex:1}
.servers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 var(--pad)}
.srv{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px;text-align:center}
.srv b{display:block;font-size:14px;font-weight:800}
.srv small{color:var(--dim);font-size:12px}
.srv.on{border-color:#fff;background:#fff;color:#000}
.srv.on small{color:#444}

/* skeleton */
.sk{background:linear-gradient(90deg,#111 0,#1d1d1d 50%,#111 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.skt{height:12px;border-radius:6px;margin-top:8px}

/* empty */
.empty{padding:56px var(--pad);text-align:center;color:var(--dim)}
.empty h2{color:#fff;font-size:20px;margin:0 0 6px}
.empty .btn{margin-top:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#777;font-size:11px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff}

/* toast + sheet */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#fff;color:#000;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);display:grid;place-items:end center;padding:16px}
.sheet{width:100%;max-width:420px;background:#111;border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px}
.sheet h2{margin:0 0 8px;font-size:22px}
.sheet p{color:#c8c8c8;margin:0 0 16px;font-size:15px}
.sheet .btn{width:100%;margin-top:8px}

/* ---------- intro (plays when the app opens) ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#000;overflow:hidden;contain:strict;will-change:transform}
#intro .spot{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 85% 46% at 50% 44%,rgba(255,255,255,.17) 0%,rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 74%)}
#intro .floor{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 50%,rgba(255,255,255,0));opacity:0}
#intro .floor:after{content:"";position:absolute;left:10%;right:10%;top:0;height:60px;background:radial-gradient(ellipse 50% 100% at 50% 0,rgba(255,255,255,.1),rgba(255,255,255,0) 70%)}
#intro .logo{position:absolute;left:50%;top:31%;width:min(56vw,300px);aspect-ratio:720/440;transform:translate(-50%,-50%)}
#intro svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#intro path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#intro .halo{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;opacity:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.36) 0%,rgba(255,255,255,.1) 34%,rgba(255,255,255,0) 66%);will-change:transform,opacity}
#intro .rim{stroke:#fff;stroke-width:64;opacity:0}
#intro .tube{stroke:#181818;stroke-width:57;opacity:0}
#intro .lit{stroke:url(#ing);stroke-width:58;opacity:0}
#intro .glow{filter:blur(16px);opacity:0;will-change:opacity}
#intro .glow path{stroke:#fff;stroke-width:62}
#intro .flare{position:absolute;left:50%;top:50%;width:300%;height:3px;margin:-1.5px 0 0 -150%;border-radius:3px;opacity:0;will-change:transform,opacity;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95) 50%,rgba(255,255,255,0));box-shadow:0 0 22px 5px rgba(255,255,255,.4)}
#intro .flash{position:absolute;inset:0;background:#fff;opacity:0}
#intro .word{position:absolute;left:0;right:0;top:54%;text-align:center;font-weight:800;font-size:min(11.5vw,54px);letter-spacing:-.02em;white-space:nowrap;line-height:1;color:#c4c4c4;opacity:0;will-change:transform,opacity}
#intro .word span{display:inline-block;transform-origin:50% 100%}
#intro .word .bl{width:0;height:0}
#intro .shim{color:transparent;opacity:1;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(105deg,rgba(255,255,255,0) 42%,#fff 50%,rgba(255,255,255,0) 58%);background-size:300% 100%;background-position:130% 0;background-repeat:no-repeat}
#intro .beam{position:absolute;top:-20%;left:0;width:34%;height:140%;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.13) 50%,rgba(255,255,255,0));will-change:transform,opacity}
#intro .abs{position:absolute;left:0;top:0;will-change:transform,opacity}
#intro .shadow{border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.9),rgba(0,0,0,0) 70%),radial-gradient(ellipse,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
#intro .puff{border-radius:50%;background:rgba(255,255,255,.5);opacity:0}
#intro .ring{border-radius:50%;border:2px solid #ffe2a6;opacity:0}
#intro .orb{border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff 0%,#fff 46%,#ffe9bd 100%)}
#intro .orb u{position:absolute;inset:-190%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,130,.85) 0%,rgba(255,190,90,.34) 30%,rgba(255,180,80,0) 66%);will-change:opacity,transform}
#intro .sq{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
#intro .bd{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 36% 28%,#fff 0%,#f2f2f2 38%,#b9b9b9 82%,#8f8f8f 100%);box-shadow:inset -3px -5px 9px rgba(0,0,0,.22),0 0 16px rgba(255,255,255,.22)}
#intro .eye{position:absolute;top:33%;width:15%;height:23%;border-radius:50%;background:#0b0b0b;will-change:transform}
#intro .eye:after{content:"";position:absolute;left:22%;top:14%;width:34%;height:30%;border-radius:50%;background:#fff}
#intro .eye.l{left:27%}#intro .eye.r{left:58%}
#intro .arm{position:absolute;top:42%;width:13%;height:44%;border-radius:45%;background:linear-gradient(#ececec,#a9a9a9);transform-origin:50% 12%;will-change:transform}
#intro .arm.l{left:-3%}#intro .arm.r{right:-3%}
#intro .foot{position:absolute;bottom:-7%;width:27%;height:15%;border-radius:50% 50% 42% 42%;background:#9d9d9d;will-change:transform}
#intro .foot.l{left:16%}#intro .foot.r{right:16%}
/* smooth scrolling on long lists: cards off screen are not drawn */
.grid>.card{content-visibility:auto;contain-intrinsic-size:auto 230px}
/* light mode for weak phones */
.lite .tbg{filter:none;transform:none;opacity:.2}
.lite .tposter{box-shadow:none}
.lite .pimg img,.lite .th img{transition:none}
.lite .sk{animation:none}
.lite .nav{background:#000}
.lite .modal{background:rgba(0,0,0,.9)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Anime | Manga switch ===== */
.seg{display:grid;grid-template-columns:1fr 1fr;margin:6px var(--pad) 2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{height:38px;border-radius:999px;font-size:15px;font-weight:700;color:var(--dim)}
.seg button.on{background:#fff;color:#000}
.spill{display:flex;align-items:center;gap:10px;margin:10px var(--pad) 0;height:46px;width:calc(100% - 2*var(--pad));border-radius:999px;background:var(--panel);border:1px solid var(--line);padding:0 18px;color:var(--dim);font-size:15px;text-align:left}
.spill svg{width:18px;height:18px}

/* ===== Manga page ===== */
.mmeta{position:relative;text-align:center;color:var(--dim);font-size:14px;margin:-6px var(--pad) 12px}
.mtags{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 var(--pad) 16px}
.mtags span{border:1px solid #444;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.chhead{display:flex;align-items:center;gap:10px;padding:24px var(--pad) 10px}
.chhead h2{margin:0;font-size:20px;font-weight:800}
.chhead .bar{width:4px;height:22px;border-radius:4px;background:#fff}
.chhead button{margin-left:auto;color:var(--dim);font-size:14px;font-weight:600;padding:6px 0 6px 10px}
.chfind{margin:0 var(--pad) 8px;display:flex;align-items:center;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--panel)}
.chfind input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 15px var(--font)}
.chlist{padding:0 var(--pad)}
.chrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;border-bottom:1px solid #1d1d1d;text-align:left;font-size:15px}
.chrow small{color:var(--dim);font-size:12px;white-space:nowrap}
.chrow.read{color:#8a8a8a}
.chrow.now{font-weight:800;color:#fff}
.chrow.now small::before{content:"Reading · ";color:#fff}
.chmore{display:block;margin:14px auto 0}

/* ===== Reader ===== */
body.reading{overflow:hidden}
.reader{position:fixed;inset:0;z-index:50;background:#000;color:#fff}
.rs{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;scrollbar-width:none}
.rs::-webkit-scrollbar{display:none}
.rz{margin:0 auto;width:min(100%,900px);padding:calc(56px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom))}
.rpg{position:relative;min-height:70vh;background:#0b0b0b;display:flex;align-items:center;justify-content:center}
.rpg.ok{min-height:0;background:none}
.rpg img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rpg .pn{position:absolute;color:#555;font-size:14px;font-weight:700}
.rpg.ok .pn{display:none}
.rpg .rt{position:absolute;padding:10px 18px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:14px}
.rend{padding:40px var(--pad) 24px;text-align:center}
.rend h3{margin:0 0 4px;font-size:18px}
.rend p{margin:0 0 18px;color:var(--dim);font-size:14px}
.rend .btn{width:100%;max-width:340px;margin:0 auto 10px;display:flex}
.rbar{position:absolute;left:0;right:0;z-index:2;background:rgba(0,0,0,.9);transition:transform .2s,opacity .2s}
.rtop{top:0;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.rtop .x{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none}
.rtop .x svg{width:20px;height:20px}
.rtop .tt{flex:1;min-width:0}
.rtop .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .tt small{color:var(--dim);font-size:12px}
.rtop .zr{height:32px;padding:0 12px;border-radius:999px;border:1px solid #444;font-size:13px;font-weight:700}
.rbot{bottom:0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.rbot .btn{height:40px}
.rbot .pc{color:var(--dim);font-size:13px;font-weight:600;min-width:64px;text-align:center}
.rprog{position:absolute;left:0;right:0;top:0;height:3px;background:#222}
.rprog i{display:block;height:3px;background:#fff;width:0}
.reader.bare .rtop{transform:translateY(-100%);opacity:0}
.reader.bare .rbot{transform:translateY(100%);opacity:0}
.rload{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px}
.zhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
.zhint.on{opacity:1}
</style>

<body>
<div id="intro" aria-hidden="true">
  <div class="spot"></div><div class="floor" id="inFloor"></div>
  <div class="logo" id="inLogo">
    <div class="halo"></div>
    <svg class="glow" viewBox="-360 -220 720 440"><path class="ip"/></svg>
    <svg viewBox="-360 -220 720 440"><defs><linearGradient id="ing" x1="0" y1="-150" x2="0" y2="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dcdcdc"/><stop offset="1" stop-color="#858585"/></linearGradient></defs>
      <path class="ip rim r1"/><path class="ip rim r2"/><path class="ip tube"/><path class="ip lit"/></svg>
    <div class="flare"></div>
  </div>
  <div class="word" id="inWord"></div><div class="word shim" id="inShim"></div>
  <div class="beam"></div><div class="flash"></div>
</div>
<script>
/* Intro (5 s): a little helper carries a glowing dot in and puts it on the last "i" of the name.
   To change the name: edit NAME below (the LAST lowercase "i" is the one that gets its dot).
   Motion and sound are both made in the browser: no video, no audio file. */
(function () {
  var NAME = 'Infinite Animes', ONCE_PER_SESSION = true;
  var el = document.getElementById('intro');
  if (!el) return;
  var tg = window.Telegram && window.Telegram.WebApp, seen = false;
  try { seen = ONCE_PER_SESSION && sessionStorage.getItem('ia_intro') === '1'; sessionStorage.setItem('ia_intro', '1'); } catch (e) {}
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!tg || !tg.initData || calm || seen || !el.animate) { el.remove(); return; }

  var DUR = 5000, T_IN = 1000, T_STOP = 1650, T_CROUCH = 1900, T_JUMP = 2100, T_PLACE = 2450, T_LAND = 2800, T_SHINE = 3500, T_BYE = 3900, T_UP = 4350;
  var W = window.innerWidth;
  function q(sel) { return el.querySelector(sel); }
  function A(node, frames, o) { o.fill = 'both'; return node.animate(frames, o); }
  function C(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function P(t, a, b) { return C((t - a) / (b - a)); }
  function eo(x) { return 1 - Math.pow(1 - x, 3); }
  function ei(x) { return x * x * x; }
  function io(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function bump(t, a, pk, b) { return t <= a || t >= b ? 0 : t < pk ? io((t - a) / (pk - a)) : 1 - io((t - pk) / (b - pk)); }

  // bake a function of time into keyframes so the browser animates it on the compositor
  function bake(node, fn) { var f = [], n = DUR / 1000 * 60, k; for (k = 0; k <= n; k++) f.push(fn(k / n * DUR)); return node.animate(f, { duration: DUR, fill: 'both', easing: 'linear' }); }
  function add(cls, w, h, html) { var n = document.createElement('div'); n.className = 'abs ' + cls; n.style.width = w + 'px'; n.style.height = (h || w) + 'px'; if (html) n.innerHTML = html; el.insertBefore(n, q('.beam')); return n; }

  /* name: every i keeps its dot except the last one */
  var wordEl = document.getElementById('inWord'), shim = document.getElementById('inShim'), last = NAME.lastIndexOf('i'), iSpan = null, i;
  for (i = 0; i < NAME.length; i++) {
    var sp = document.createElement('span'), ch = NAME[i];
    sp.textContent = ch === ' ' ? ' ' : (i === last ? 'ı' : ch);
    if (i === last) iSpan = sp;
    wordEl.appendChild(sp);
  }
  shim.textContent = NAME.slice(0, last) + 'ı' + NAME.slice(last + 1);
  var bl = document.createElement('span'); bl.className = 'bl'; wordEl.appendChild(bl);
  var fs = parseFloat(getComputedStyle(wordEl).fontSize), base = bl.getBoundingClientRect().top;
  var R = fs * 0.082, S = fs * 1.2, ir = (iSpan || wordEl).getBoundingClientRect();
  var spot = { x: ir.left + ir.width / 2, y: base - fs * 0.655 };
  var floorY = base + fs * 1.85, rise = (floorY - S - R * 3.0) - spot.y, x0 = -S * 1.4, xE = W + S * 1.6;
  document.getElementById('inFloor').style.top = floorY + 'px';

  /* stage */
  A(q('.spot'), [{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: 'ease-out' });
  A(q('.floor'), [{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 300 });
  A(wordEl, [{ opacity: 0, transform: 'scale(1.1)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 800, delay: 150, easing: 'cubic-bezier(.2,.7,.2,1)' });
  A(wordEl, [{ color: '#c4c4c4', textShadow: '0 0 0 rgba(255,255,255,0)' }, { color: '#fff', textShadow: '0 0 22px rgba(255,255,255,.35)' }], { duration: 500, delay: T_SHINE + 150 });
  if (iSpan) A(iSpan, [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.72)', offset: .2 }, { transform: 'scaleY(1.1)', offset: .55 }, { transform: 'scaleY(1)' }], { duration: 340, delay: T_PLACE, easing: 'ease-out' });
  A(shim, [{ backgroundPosition: '130% 0' }, { backgroundPosition: '-30% 0' }], { duration: 750, delay: T_SHINE, easing: 'cubic-bezier(.4,0,.2,1)' });
  A(q('.beam'), [{ opacity: 0, transform: 'translateX(-60%) skewX(-16deg)' }, { opacity: 1, offset: .3 }, { opacity: 1, offset: .7 }, { opacity: 0, transform: 'translateX(330%) skewX(-16deg)' }], { duration: 800, delay: T_SHINE - 40, easing: 'cubic-bezier(.4,0,.2,1)' });

  /* the helper */
  function cx(t) { return t < T_IN ? x0 : t < T_STOP ? x0 + (spot.x - x0) * eo(P(t, T_IN, T_STOP)) : t < T_BYE ? spot.x : spot.x + (xE - spot.x) * ei(P(t, T_BYE, T_BYE + 430)); }
  function up(t) {
    var y = 0, p;
    if (t > T_IN && t < T_STOP - 40) { p = P(t, T_IN, T_STOP - 40); y += Math.abs(Math.sin(p * Math.PI * 5)) * fs * 0.13 * (1 - p * .6); }
    if (t >= T_JUMP && t < T_PLACE) y += rise * (1 - Math.pow(1 - P(t, T_JUMP, T_PLACE), 2));
    if (t >= T_PLACE && t < T_LAND) y += rise * (1 - Math.pow(P(t, T_PLACE, T_LAND), 2));
    if (t > 2960 && t < 3260) y += fs * 0.3 * Math.sin(P(t, 2960, 3260) * Math.PI);

  }
  function sy(t) {
    return 1 - .17 * bump(t, T_IN, T_IN + 150, T_STOP) - .2 * bump(t, T_STOP - 30, T_STOP + 50, T_STOP + 230) + .07 * bump(t, T_STOP + 120, T_STOP + 190, T_STOP + 300)
      - .24 * bump(t, T_CROUCH, T_JUMP - 30, T_JUMP + 40) + .2 * bump(t, T_JUMP, T_JUMP + 120, T_PLACE) + .13 * bump(t, T_PLACE + 120, T_LAND - 40, T_LAND)
      - .25 * bump(t, T_LAND - 10, T_LAND + 55, T_LAND + 190) + .08 * bump(t, T_LAND + 120, T_LAND + 200, T_LAND + 320)
      - .16 * bump(t, 2880, 2950, 2990) + .1 * bump(t, 2960, 3040, 3200) - .2 * bump(t, 3240, 3290, 3420)
      - .2 * bump(t, T_BYE - 190, T_BYE - 20, T_BYE + 40) - .15 * bump(t, T_BYE + 20, T_BYE + 200, T_BYE + 430);
  }
  function lean(t) { return 13 * bump(t, T_IN, T_IN + 180, T_STOP - 30) - 9 * bump(t, T_STOP - 40, T_STOP + 40, T_STOP + 260) + 15 * bump(t, T_BYE, T_BYE + 150, T_BYE + 430); }
  function top(t) { return floorY - up(t) - S * sy(t); }

  var shadow = add('shadow', S * 1.2, S * 0.26);
  var chr = add('chr', S, S, '<div class="sq"><div class="foot l"></div><div class="foot r"></div><div class="arm l"></div><div class="arm r"></div><div class="bd"></div><div class="eye l"></div><div class="eye r"></div></div>');
  var orb = add('orb', R * 2, R * 2, '<u></u>'), sq = chr.firstChild;
  bake(chr, function (t) { return { transform: 'translate(' + (cx(t) - S / 2).toFixed(1) + 'px,' + (floorY - up(t) - S).toFixed(1) + 'px) rotate(' + lean(t).toFixed(1) + 'deg)' }; });
  bake(sq, function (t) { var v = sy(t); return { transform: 'scale(' + Math.pow(v, -.8).toFixed(3) + ',' + v.toFixed(3) + ')' }; });
  bake(shadow, function (t) { var k = 1 - .55 * C(up(t) / rise); return { opacity: (t < T_IN ? 0 : k).toFixed(2), transform: 'translate(' + (cx(t) - S * .6).toFixed(1) + 'px,' + (floorY - S * .13).toFixed(1) + 'px) scale(' + (k * Math.pow(sy(t), -.8)).toFixed(3) + ',' + k.toFixed(3) + ')' }; });
  var eyes = chr.querySelectorAll('.eye'), arms = chr.querySelectorAll('.arm'), feet = chr.querySelectorAll('.foot');
  [0, 1].forEach(function (k) {
    bake(eyes[k], function (t) {   // look up at the i, blink, then squint happily
      var lookY = -S * .07 * (bump(t, T_STOP + 60, T_STOP + 220, T_PLACE + 120)), lookX = S * .03 * bump(t, T_IN, T_IN + 200, T_STOP) + S * .035 * bump(t, T_BYE - 150, T_BYE + 100, T_BYE + 430);
      var s = 1 - .9 * bump(t, 1330, 1380, 1440) - .62 * bump(t, T_LAND + 60, T_LAND + 200, T_SHINE + 250) - .9 * bump(t, 3640, 3690, 3750);
      return { transform: 'translate(' + lookX.toFixed(2) + 'px,' + lookY.toFixed(2) + 'px) scaleY(' + Math.max(.1, s).toFixed(2) + ')' };
    });
    bake(arms[k], function (t) {   // arms hold the dot overhead, then one waves
      var sgn = k ? -1 : 1, hold = 1 - P(t, T_PLACE, T_PLACE + 160), a = sgn * (168 * hold + 16 * (1 - hold));
      if (k) a += -(118 + 26 * Math.sin((t - 2950) / 500 * Math.PI * 4.2)) * bump(t, 2900, 3080, 3560) - (112 + 28 * Math.sin((t - 3600) / 300 * Math.PI * 3)) * bump(t, 3570, 3680, T_BYE - 20);
      else a += 30 * bump(t, 2940, 3100, 3300);
      return { transform: 'rotate(' + a.toFixed(1) + 'deg)' };
    });
    bake(feet[k], function (t) {   // quick steps while running, tucked in the air
      var run = (t > T_IN && t < T_STOP) || (t > T_BYE && t < T_BYE + 430) ? Math.sin(t / 34 + k * Math.PI) : 0, air = C(up(t) / (fs * .3));
      return { transform: 'translate(' + (run * S * .09).toFixed(1) + 'px,' + (-Math.max(0, run) * S * .09 - air * S * .06).toFixed(1) + 'px)' };
    });
  });
  bake(orb, function (t) {       // carried above the head, then set on the i with a spring
    var x, y, k;
    if (t < T_PLACE) { x = cx(t) + lean(t) * S * .012; y = top(t) - R * 3.0 + Math.sin(t / 90) * R * .25; k = 1.9; }
    else { x = spot.x; y = spot.y; k = 1 + .75 * (1 - spring(P(t, T_PLACE, T_PLACE + 520) * 1.25)) ; }
    return { transform: 'translate(' + (x - R).toFixed(1) + 'px,' + (y - R).toFixed(1) + 'px) scale(' + k.toFixed(3) + ')' };
  });
  bake(orb.firstChild, function (t) { return { opacity: ((t < T_IN ? 0 : 1) * (1 - P(t, T_SHINE + 100, T_SHINE + 500)) * (.8 + .2 * Math.sin(t / 110))).toFixed(2), transform: 'scale(' + (1 + .9 * bump(t, T_PLACE, T_PLACE + 90, T_PLACE + 420)).toFixed(2) + ')' }; });
  A(orb, [{ background: 'radial-gradient(circle at 38% 34%,#fff 0%,#fff 46%,#ffe9bd 100%)' }, { background: '#fff' }], { duration: 300, delay: T_SHINE + 150 });
  function fx(cls, x, y, size, at, dur, s0, s1, o0) {
    var n = add(cls, size), t = 'translate(' + (x - size / 2).toFixed(1) + 'px,' + (y - size / 2).toFixed(1) + 'px) ';
    n.animate([{ opacity: o0, transform: t + 'scale(' + s0 + ')' }, { opacity: 0, transform: t + 'scale(' + s1 + ')' }], { duration: dur, delay: at, easing: 'ease-out', fill: 'forwards' });
  }
  fx('ring', spot.x, spot.y, R * 6, T_PLACE, 520, .3, 2.1, .95); fx('ring', spot.x, spot.y, R * 6, T_PLACE + 110, 520, .3, 1.5, .6);
  [[T_STOP, 1, -.9], [T_STOP, .7, -1.6], [T_LAND, .9, -.8], [T_LAND, .9, .8], [T_BYE, .8, -1]].forEach(function (pf) { fx('puff', spot.x + pf[2] * S * .55, floorY - S * .06, S * .22 * pf[1], pf[0], 420, .5, 2.2, .5); });

  /* logo: dark with light on its edges, switched on with the shine */
  var d = '', u, s, c;
  for (i = 0; i <= 160; i++) { u = i / 160 * Math.PI * 2 + Math.PI / 2; s = Math.sin(u); c = Math.cos(u); d += (i ? ' L' : 'M') + (300 * c / (1 + s * s)).toFixed(1) + ' ' + (396 * s * c / (1 + s * s)).toFixed(1); }
  var paths = el.querySelectorAll('.ip');
  for (i = 0; i < paths.length; i++) paths[i].setAttribute('d', d + ' Z');
  var len = paths[0].getTotalLength(), seg = len * 0.15;
  A(q('.tube'), [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 150 });
  [['.r1', 0.05, -1.7], ['.r2', -0.45, 1.25]].forEach(function (r) {
    var p = q(r[0]); p.style.strokeDasharray = seg + ' ' + (len - seg);
    A(p, [{ strokeDashoffset: r[1] * len + 'px' }, { strokeDashoffset: r[2] * len + 'px' }], { duration: T_SHINE - 800, delay: 850, easing: 'cubic-bezier(.4,0,.5,1)' });
    A(p, [{ opacity: 0 }, { opacity: 1, offset: .1 }, { opacity: 1, offset: .92 }, { opacity: 0 }], { duration: T_SHINE - 700, delay: 850 });
  });
  var IGN = T_SHINE + 120;
  A(q('.lit'), [{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: IGN, easing: 'ease-out' });
  A(q('.glow'), [{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: .5 }], { duration: 1200, delay: IGN, easing: 'ease-out' });
  A(q('.halo'), [{ opacity: 0, transform: 'scale(.45)' }, { opacity: 1, offset: .1 }, { opacity: .45, transform: 'scale(1)' }], { duration: 1300, delay: IGN, easing: 'ease-out' });
  A(q('.flare'), [{ opacity: 0, transform: 'scaleX(.05)' }, { opacity: 1, transform: 'scaleX(1)', offset: .14 }, { opacity: 0, transform: 'scaleX(1.15)' }], { duration: 1000, delay: IGN, easing: 'ease-out' });
  A(q('.flash'), [{ opacity: 0 }, { opacity: .32, offset: .08 }, { opacity: 0 }], { duration: 520, delay: IGN - 30, easing: 'ease-out' });

  /* curtain up: the whole intro slides away and the app is underneath */
  A(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-103%)' }], { duration: 600, delay: T_UP, easing: 'cubic-bezier(.7,0,.2,1)' });
  [[T_PLACE, 'medium'], [T_LAND, 'light'], [IGN, 'heavy']].forEach(function (h) { setTimeout(function () { try { if (!gone) tg.HapticFeedback.impactOccurred(h[1]); } catch (e) {} }, h[0]); });

  var ctx = null, gone = false;
  function finish(fast) {
    if (gone) return; gone = true;
    if (fast) el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
    setTimeout(function () { el.remove(); if (ctx) { try { ctx.close(); } catch (e) {} } }, fast ? 260 : 20);
  }
  el.addEventListener('click', function () { finish(true); });   // tap to skip
  setTimeout(finish, DUR);

  /* ---- sound ---- */
  function play() {
    var t0 = ctx.currentTime + 0.03, hit = t0 + 3.62;
    var master = ctx.createGain(); master.gain.value = 0.6;
    var comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    function noise(dur) { var n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), ch = buf.getChannelData(0); for (var j = 0; j < n; j++) ch[j] = Math.random() * 2 - 1; var src = ctx.createBufferSource(); src.buffer = buf; return src; }
    function tone(type, st, f0, f1, ft, pk, dur, at) { var o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f0, st); if (f1) o.frequency.exponentialRampToValueAtTime(f1, st + ft); g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(pk, st + (at || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, st + dur); o.connect(g); g.connect(master); o.start(st); o.stop(st + dur + 0.03); }
    function air(st, dur, f0, f1, pk, q) { var n = noise(dur), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'bandpass'; f.Q.value = q || 1.2; f.frequency.setValueAtTime(f0, st); f.frequency.exponentialRampToValueAtTime(f1, st + dur); g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(pk, st + dur * .7); g.gain.exponentialRampToValueAtTime(0.0001, st + dur); n.connect(f); f.connect(g); g.connect(master); n.start(st); n.stop(st + dur); }
    // room tone under the spotlight
    tone('sine', t0, 55, 0, 0, 0.16, 3.5, 0.9); tone('sine', t0, 82.4, 0, 0, 0.07, 3.5, 0.9);
    // quick little steps, then a skid
    for (var k = 0; k < 6; k++) tone('triangle', t0 + 1.0 + k * 0.1, 900 + k * 70, 500, 0.04, 0.09, 0.07, 0.004);
    air(t0 + 1.55, 0.2, 3200, 900, 0.14, 2);
    // winding up, then the jump
    tone('sine', t0 + 1.9, 300, 520, 0.2, 0.08, 0.22, 0.05);
    tone('sine', t0 + 2.1, 380, 1250, 0.33, 0.13, 0.36, 0.03); air(t0 + 2.1, 0.36, 700, 3600, 0.1);
    // the dot lands on the i: a bright little bell
    [[1567.98, 0.3, 1.1], [2093, 0.2, 0.9], [3135.96, 0.09, 0.6], [783.99, 0.16, 0.7]].forEach(function (b) { tone('sine', t0 + 2.45, b[0], 0, 0, b[1], b[2], 0.004); });
    tone('sine', t0 + 2.45, 240, 90, 0.08, 0.2, 0.14, 0.006);
    // back on the floor, and a happy chirp
    tone('sine', t0 + 2.8, 170, 60, 0.09, 0.36, 0.2, 0.006); air(t0 + 2.8, 0.12, 1400, 500, 0.07, 1);
    tone('sine', t0 + 3.0, 880, 1320, 0.07, 0.11, 0.13, 0.008); tone('sine', t0 + 3.16, 1175, 1760, 0.07, 0.11, 0.16, 0.008);
    // light sweeping across the name

    var name = r.genre || r.mtype || 'Browse manga';
    var types = ['', 'Manga', 'Manhwa', 'Manhua'];
    app.innerHTML = '<div class="ph"><h1>' + esc(name) + '</h1><p id="cnt">&nbsp;</p></div>' +
      (r.genre ? '' : '<div class="chips" id="mtypes" style="margin-bottom:8px">' + types.map(function (t) { return '<button class="chip' + ((r.mtype || '') === t ? ' on' : '') + '" data-mt="' + t + '">' + (t || 'All') + '</button>'; }).join('') + '</div>') +
      '<div class="chips sorts" id="sorts">' + [['', 'Latest'], ['chapters', 'Most chapters'], ['az', 'A to Z'], ['year', 'Year']].map(function (s) { return '<button class="chip' + ((r.sort || '') === s[0] ? ' on' : '') + '" data-sort="' + s[0] + '">' + s[1] + '</button>'; }).join('') +
      '</div><div class="grid" id="grid">' + skel(9) + '</div><div class="sentinel" id="sen"></div>';
    var page = 0, busy = false, done = false, first = true, grid = document.getElementById('grid');
    function load() {
      if (busy || done) return; busy = true; page++;
      var qs = 'page=' + page + (r.genre ? '&genre=' + encodeURIComponent(r.genre) : '') + (r.mtype ? '&type=' + encodeURIComponent(r.mtype) : '') + (r.sort ? '&sort=' + r.sort : '');
      api('/api/manga/list?' + qs).then(function (d) {
        if (!alive()) return;
        if (first) { first = false; grid.innerHTML = ''; document.getElementById('cnt').textContent = d.total.toLocaleString('en-US') + ' titles'; if (!d.total) grid.outerHTML = empty('Nothing here', 'Try another type or genre.'); }
        grid.insertAdjacentHTML('beforeend', d.items.map(function (c) { return mcardHtml(c); }).join(''));
        done = !d.more; busy = false;
      }).catch(function (e) { busy = false; page--; if (first) grid.outerHTML = empty('Could not load', errMsg(e), true); else toast(errMsg(e)); });
    }
    new IntersectionObserver(function (en) { if (en[0].isIntersecting && alive()) load(); }, { rootMargin: '600px' }).observe(document.getElementById('sen'));
    document.getElementById('sorts').addEventListener('click', function (ev) { var b = ev.target.closest('[data-sort]'); if (!b) return; haptic(); r.sort = b.dataset.sort; render(r); });
    var mt = document.getElementById('mtypes');
    if (mt) mt.addEventListener('click', function (ev) { var b = ev.target.closest('[data-mt]'); if (!b) return; haptic(); r.mtype = b.dataset.mt; render(r); });
  }

  /* ---------- MANGA SEARCH (sirf manga) ---------- */
  var lastMQ = '';
  function mSearch(r, alive) {
    app.innerHTML = '<div class="searchbar"><label class="sbox"><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search manga, manhwa, manhua" aria-label="Search manga" value="' + esc(lastMQ) + '">' + ICON.search + '</label></div><div id="res"></div><div class="sentinel" id="sen"></div>';
    var input = document.getElementById('q'), res = document.getElementById('res');
    var timer, page = 0, busy = false, done = true, q = '', seq = 0;
    function idle() {
      var cr = rhist();
      res.innerHTML = cr.length ? heading('Recently read') + '<div class="grid">' + cr.map(function (c) { return mcardHtml(c, c.label); }).join('') + '</div>' : '<p class="note">Type a name. Part of a name works too, like "solo lev".</p>';
    }
    function run(t) {
      q = t.trim(); lastMQ = t;
      if (!q) { done = true; idle(); return; }
      page = 0; done = false; busy = false;
      res.innerHTML = '<div class="grid" id="grid">' + skel(6) + '</div>';
      more(true);
    }
    function more(fresh) {
      if (busy || done || !q) return; busy = true; page++;
      var my = ++seq;
      api('/api/manga/search?q=' + encodeURIComponent(q) + '&page=' + page).then(function (d) {
        if (!alive() || my !== seq) return;
        var grid = document.getElementById('grid');
        if (fresh) grid.innerHTML = '';
        if (!d.total) { res.innerHTML = empty('No manga found for "' + q + '"', 'Check the spelling or type a shorter part of the name.'); done = true; busy = false; return; }
        grid.insertAdjacentHTML('beforeend', d.items.map(function (c) { return mcardHtml(c); }).join(''));
        done = !d.more; busy = false;
      }).catch(function (e) { busy = false; if (my === seq) toast(errMsg(e)); });
    }
    input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { run(input.value); }, 250); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { input.blur(); clearTimeout(timer); run(input.value); } });
    new IntersectionObserver(function (en) { if (en[0].isIntersecting && alive()) more(false); }, { rootMargin: '600px' }).observe(document.getElementById('sen'));
    if (lastMQ) run(lastMQ); else idle();
    if (r.focus) setTimeout(function () { input.focus(); }, 60);
  }

  /* ---------- LIBRARY ---------- */
  function mLib(r, alive) {
    var cr = rhist();
    app.innerHTML = '<div class="ph"><h1>Library</h1><p>' + (cr.length ? cr.length + ' manga you have read' : '&nbsp;') + '</p></div>' +
      (cr.length ? '<div class="grid">' + cr.map(function (c) { return mcardHtml(c, c.label); }).join('') + '</div>' : empty('Nothing here yet', 'Manga you read will show up here, so you can continue where you left off.'));
  }

  /* ---------- MANGA PAGE ---------- */
  var CH_STEP = 100;
  function mTitle(r, alive) {
    app.innerHTML = '<div class="tpage"><div class="tposter"><div class="pimg sk"></div></div><div class="sk skt" style="width:60%;height:22px;margin:18px auto"></div></div>';
    getManga(r.slug).then(function (m) {
      if (!alive()) return;
      var ch = m.chapters || [], h = rfind(m.slug);
      var meta = [m.type, m.status, m.year].filter(Boolean);
      if (m.authors && m.authors.length) meta.push('by ' + m.authors.slice(0, 2).join(', '));
      var html = '<div class="tpage"><div class="tbg" style="background-image:url(\'' + esc(m.cover || '') + '\')"></div>' +
        '<div class="tposter">' + poster(m.cover, m.title) + '</div><div class="ttl">' + esc(m.title) + '</div>' +
        (meta.length ? '<div class="mmeta">' + esc(meta.join(' · ')) + '</div>' : '') +
        (m.genres && m.genres.length ? '<div class="mtags">' + m.genres.slice(0, 8).map(function (g) { return '<span>' + esc(g) + '</span>'; }).join('') + '</div>' : '');
      if (ch.length) {
        var firstC = ch[ch.length - 1], lastC = ch[0];
        html += '<div class="two">' +
          '<button class="ob white" data-mread="' + esc(h ? h.key : firstC.key) + '"' + (h && h.page ? ' data-page="' + h.page + '"' : '') + '>' + ICON.book + '<span><b>' + (h ? 'Continue' : 'Start reading') + '</b><small>' + esc(h ? h.label : firstC.label) + '</small></span></button>' +
          '<button class="ob" data-mread="' + esc(lastC.key) + '">' + ICON.book + '<span><b>Latest</b><small>' + esc(lastC.label) + '</small></span></button></div>';
      }
      if (m.description) html += '<div class="box"><h3>Story</h3><p class="clamp" id="ov">' + esc(m.description) + '</p><button class="rm" id="ovb">Read more</button></div>';
      html += '<div class="chhead"><span class="bar"></span><h2>Chapters (' + ch.length + ')</h2>' + (ch.length > 1 ? '<button id="chsort">' + (r.asc ? 'Oldest first' : 'Newest first') + ' ⇅</button>' : '') + '</div>';
      if (ch.length > 30) html += '<label class="chfind"><input id="chq" type="search" inputmode="decimal" placeholder="Go to chapter number" aria-label="Find chapter"></label>';
      html += ch.length ? '<div class="chlist" id="chl"></div><button class="btn dark chmore hidden" id="chm">Show more chapters</button>' : '<p class="note">No chapters yet. New chapters show up here automatically.</p>';
      app.innerHTML = html + '</div>';
      var ov = document.getElementById('ov'), ovb = document.getElementById('ovb');
      if (ov && ovb) { if (ov.scrollHeight <= ov.clientHeight + 2) ovb.remove(); else ovb.onclick = function () { ov.classList.toggle('clamp'); ovb.textContent = ov.classList.contains('clamp') ? 'Read more' : 'Show less'; }; }
      if (!ch.length) return;
      var list = r.asc ? ch.slice().reverse() : ch, shown = 0, filt = null;
      var readSet = {}; (ls('crd_' + m.slug) || []).forEach(function (k) { readSet[k] = 1; });
      var box = document.getElementById('chl'), moreBtn = document.getElementById('chm');
      function rows(arr) {
        return arr.map(function (c) {
          var cls = 'chrow' + (h && h.key === c.key ? ' now' : readSet[c.key] ? ' read' : '');
          return '<button class="' + cls + '" data-mread="' + esc(c.key) + '"><span>' + esc(c.label) + '</span><small>' + esc(c.date || '') + '</small></button>';
        }).join('');
      }
      function draw(reset) {
        var src = filt || list;
        if (reset) { box.innerHTML = ''; shown = 0; }
        box.insertAdjacentHTML('beforeend', rows(src.slice(shown, shown + CH_STEP)));
        shown += CH_STEP;
        moreBtn.classList.toggle('hidden', shown >= src.length);
        if (filt && !filt.length) box.innerHTML = '<p class="note">No chapter with that number.</p>';
      }
      draw(true);
      moreBtn.onclick = function () { haptic(); draw(false); };
      var sb = document.getElementById('chsort');
      if (sb) sb.onclick = function () { haptic(); r.asc = !r.asc; list = r.asc ? ch.slice().reverse() : ch; sb.textContent = (r.asc ? 'Oldest first' : 'Newest first') + ' ⇅'; draw(true); };
      var qi = document.getElementById('chq');
      if (qi) qi.addEventListener('input', function () {
        var v = qi.value.trim();
        filt = v ? list.filter(function (c) { return c.num != null && String(c.num).indexOf(v) === 0; }) : null;
        draw(true);
      });
    }).catch(function (e) {
      if (!alive() || gate(e, r, alive)) return;
      app.innerHTML = empty(e.code === 'age_blocked' ? 'Not available' : 'Could not load', e.code === 'not_found' ? 'This manga was not found.' : errMsg(e), e.code !== 'age_blocked' && e.code !== 'not_found');
    });
  }

  /* ---------- READER ---------- */
  var readerEl = null;
  function closeReader() {
    if (!readerEl) return;
    if (readerEl._cleanup) readerEl._cleanup();
    readerEl.remove(); readerEl = null;
    document.body.classList.remove('reading');
    nav.classList.remove('hidden');
  }
  function mRead(r, alive) {
    nav.classList.add('hidden');
    document.body.classList.add('reading');
    var ov = document.createElement('div');
    ov.className = 'reader';
    ov.innerHTML = '<div class="rs" id="rs"><div class="rz" id="rz"></div></div><div class="rload" id="rl">Loading chapter...</div>' +
      '<div class="rbar rtop"><button class="x" data-rx aria-label="Close">' + ICON.close + '</button><div class="tt"><b id="rtt">&nbsp;</b><small id="rch">&nbsp;</small></div><button class="zr hidden" id="zr">1x</button></div>' +
      '<div class="rbar rbot"><div class="rprog"><i id="rpi"></i></div><button class="btn dark" id="rprev" disabled>' + ICON.prev + 'Prev</button><div class="pc" id="rpc">&nbsp;</div><button class="btn white" id="rnext" disabled>Next' + ICON.next + '</button></div>' +
      '<div class="zhint" id="zh"></div>';
    document.body.appendChild(ov);
    readerEl = ov;
    var rs = ov.querySelector('#rs'), rz = ov.querySelector('#rz'), pc = ov.querySelector('#rpc'), pi = ov.querySelector('#rpi'), zr = ov.querySelector('#zr');
    var pages = [], total = 0, cur = 0, chapters = [], idx = -1, m = null, zoom = 1, saveT = 0;

    function label(c) { return c ? c.label : ''; }
    function neighbour(d) { var c = chapters[idx + d]; return c || null; } // chapters newest first: -1 = next (newer), +1 = prev (older)

    Promise.all([getManga(r.slug), api('/api/manga/read', { method: 'POST', body: { slug: r.slug, key: r.key } })]).then(function (res) {
      if (!alive()) return;
      m = res[0]; var d = res[1];
      chapters = m.chapters || [];
      idx = chapters.findIndex(function (c) { return c.key === r.key; });
      var me = chapters[idx] || { key: r.key, label: d.label };
      ov.querySelector('#rtt').textContent = m.title;
      ov.querySelector('#rch').textContent = me.label;
      var nx = neighbour(-1), pv = neighbour(1);
      var bp = ov.querySelector('#rprev'), bn = ov.querySelector('#rnext');
      bp.disabled = !pv; bn.disabled = !nx;
      bp.onclick = function () { if (pv) { haptic(); go({ name: 'mread', tab: r.tab, slug: r.slug, key: pv.key }, { replace: true }); } };
      bn.onclick = function () { if (nx) { haptic(); go({ name: 'mread', tab: r.tab, slug: r.slug, key: nx.key }, { replace: true }); } };
      pages = d.pages; total = pages.length;
      ov.querySelector('#rl').remove();
      rz.innerHTML = pages.map(function (p, i) { return '<div class="rpg" data-i="' + i + '"><span class="pn">Page ' + (i + 1) + '</span></div>'; }).join('') +
        '<div class="rend"><h3>End of ' + esc(me.label) + '</h3><p>' + esc(m.title) + '</p>' +
        (nx ? '<button class="btn white" data-rgo="' + esc(nx.key) + '">Next: ' + esc(nx.label) + '</button>' : '<p>You are up to date. New chapters show up automatically.</p>') +
        '<button class="btn dark" data-rx>Back to chapters</button></div>';
      // mark read
      var rd = ls('crd_' + m.slug) || []; if (rd.indexOf(r.key) < 0) { rd.push(r.key); ls('crd_' + m.slug, rd.slice(-3000)); }
      setupImages();
      if (r.page && r.page > 1) setTimeout(function () { var el = rz.querySelector('[data-i="' + (r.page - 1) + '"]'); if (el) rs.scrollTop = el.offsetTop - 56; }, 400);
      update();
      // agla chapter pehle se tayyar (photos ke link)
      if (nx) setTimeout(function () { if (alive()) api('/api/manga/read', { method: 'POST', body: { slug: r.slug, key: nx.key } }).catch(function () {}); }, 4000);
    }).catch(function (e) {
      if (!alive()) return;
      if (e.code === 'age_required') { closeReader(); gate(e, r, alive); return; }
      var t = e.code === 'no_pages' ? 'This chapter has no pages yet.' : e.code === 'source_down' ? 'The manga source is not responding. Try again in a minute.' : errMsg(e);
      ov.querySelector('#rl').innerHTML = '<div class="empty"><h2>Could not open chapter</h2><p>' + esc(t) + '</p><button class="btn dark" data-rretry>Try again</button></div>';
    });

    /* photos: paas wali pehle, door wali baad mein; na khule to backup link, phir "Tap to retry" */
    var io, far;
    function loadImg(box) {
      if (box._started) return; box._started = true;
      var i = +box.dataset.i, p = pages[i], im = new Image(), tried = 0;
      im.decoding = 'async'; im.referrerPolicy = 'no-referrer'; im.alt = 'Page ' + (i + 1); im.draggable = false;
      im.onload = function () { box.style.height = ''; box.classList.add('ok'); var t = box.querySelector('.rt'); if (t) t.remove(); if (!im.parentNode) box.appendChild(im); };
      im.onerror = function () {
        tried++;
        if (tried === 1) { im.src = p.b; return; }
        if (tried === 2) { im.src = p.u + (p.u.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now(); return; }
        if (!box.querySelector('.rt')) box.insertAdjacentHTML('beforeend', '<button class="rt" data-rimg>Tap to retry</button>');
        box._retry = function () { tried = 0; im.src = p.u; };
      };
      im.src = p.u;
    }
    function setupImages() {
      var boxes = rz.querySelectorAll('.rpg');
      for (var i = 0; i < Math.min(3, boxes.length); i++) loadImg(boxes[i]);
      io = new IntersectionObserver(function (en) { en.forEach(function (x) { if (x.isIntersecting) loadImg(x.target); }); }, { root: rs, rootMargin: '1800px 0px' });
      boxes.forEach(function (b) { io.observe(b); });
      // long chapters: pages far away are let go (same height kept, so nothing jumps) and load again when you come back.
      // stops weak phones running out of memory and closing the app.
      far = new IntersectionObserver(function (en) {
        en.forEach(function (x) {
          var b = x.target, im = b.querySelector('img');
          if (x.isIntersecting || !b._started || !im || !b.classList.contains('ok')) return;
          b.style.height = b.offsetHeight + 'px'; im.remove(); b.classList.remove('ok'); b._started = false;
        });
      }, { root: rs, rootMargin: (LITE ? 5000 : 12000) + 'px 0px' });
      boxes.forEach(function (b) { far.observe(b); });
    }

    /* progress + Continue reading */
    function update() {
      if (!total) return;
      var mid = rs.scrollTop + rs.clientHeight * 0.35, boxes = rz.querySelectorAll('.rpg'), n = 0;
      for (var i = 0; i < boxes.length; i++) { if (boxes[i].offsetTop * 1 <= mid) n = i; else break; }
      cur = n;
      pc.textContent = (n + 1) + ' / ' + total;
      var max = rs.scrollHeight - rs.clientHeight;
      pi.style.width = (max > 0 ? Math.min(100, (rs.scrollTop / max) * 100) : 0) + '%';
      clearTimeout(saveTO);
      if (Date.now() - saveT > 1500) save(); else saveTO = setTimeout(save, 1600);
    }
    var saveTO = 0;
    function save() {
      if (!m) return;
      saveT = Date.now();
      var me = chapters[idx] || { key: r.key, label: '' };
      rhist({ slug: m.slug, title: m.title, cover: m.cover, key: r.key, label: me.label.replace(/^Chapter\s*/i, 'Ch '), page: cur + 1, at: saveT });
    }
    var ticking = false;
    rs.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; update(); }); } }, { passive: true });

    /* ---------- zoom: pinch, double-tap, 1x button ---------- */
    var hint = ov.querySelector('#zh'), hintT;
    function showHint(t) { hint.textContent = t; hint.classList.add('on'); clearTimeout(hintT); hintT = setTimeout(function () { hint.classList.remove('on'); }, 700); }
    function baseW() { return Math.min(rs.clientWidth, 900); }
    function setZoom(z, cx, cy) {
      z = Math.max(1, Math.min(4, z));
      var oldW = rz.offsetWidth, offL = rz.offsetLeft;
      var x = rs.scrollLeft + cx - offL, y = rs.scrollTop + cy;
      var ratio = (baseW() * z) / oldW;
      zoom = z;
      rz.style.width = z === 1 ? '' : (baseW() * z) + 'px';
      var newOff = rz.offsetLeft;
      rs.scrollLeft = x * ratio - cx + newOff;
      rs.scrollTop = y * ratio - cy;
      zr.classList.toggle('hidden', z <= 1.01);
      zr.textContent = 'Reset ' + z.toFixed(1) + 'x';
    }
    zr.onclick = function () { haptic(); setZoom(1, rs.clientWidth / 2, rs.clientHeight / 2); showHint('1x'); };
    var pinch = null, tap = null, lastTap = 0, tapT = null;
    rs.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        var a = e.touches[0], b = e.touches[1];
        pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: zoom, cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2 };
        tap = null;
      } else if (e.touches.length === 1) {
        tap = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), moved: false };
      }
    }, { passive: true });
    var raf = 0, pend = null;
    rs.addEventListener('touchmove', function (e) {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        var a = e.touches[0], b = e.touches[1];
        var d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        pend = pinch.z * d / pinch.d;
        if (!raf) raf = requestAnimationFrame(function () { raf = 0; if (pend) setZoom(pend, pinch ? pinch.cx : rs.clientWidth / 2, pinch ? pinch.cy : rs.clientHeight / 2); });
      } else if (tap) {
        var t = e.touches[0];
        if (Math.abs(t.clientX - tap.x) > 10 || Math.abs(t.clientY - tap.y) > 10) tap.moved = true;
      }
    }, { passive: false });
    rs.addEventListener('touchend', function (e) {
      if (pinch && e.touches.length < 2) { pinch = null; showHint(zoom.toFixed(1) + 'x'); return; }
      if (!tap || tap.moved || Date.now() - tap.t > 300) { tap = null; return; }
      if (e.target.closest('button')) { tap = null; return; }
      var x = tap.x, y = tap.y; tap = null;
      var now = Date.now();
      if (now - lastTap < 300) { // double tap: zoom
        clearTimeout(tapT); lastTap = 0;
        haptic();
        setZoom(zoom > 1.05 ? 1 : 2.5, x, y);
        showHint(zoom > 1.05 ? zoom.toFixed(1) + 'x' : '1x');
        e.preventDefault();
        return;
      }
      lastTap = now;
      tapT = setTimeout(function () { ov.classList.toggle('bare'); }, 300); // single tap: bars show/hide
    });
    // computer pe: double click se zoom
    rs.addEventListener('dblclick', function (e) { setZoom(zoom > 1.05 ? 1 : 2, e.clientX, e.clientY); });

    ov.addEventListener('click', function (ev) {
      var el;
      if ((el = ev.target.closest('[data-rx]'))) { haptic(); back(); return; }
      if ((el = ev.target.closest('[data-rgo]'))) { haptic('medium'); go({ name: 'mread', tab: r.tab, slug: r.slug, key: el.dataset.rgo }, { replace: true }); return; }
      if ((el = ev.target.closest('[data-rimg]'))) { var bx = el.closest('.rpg'); el.remove(); if (bx && bx._retry) bx._retry(); return; }
      if (ev.target.closest('[data-rretry]')) { cache.clear(); render(r); }
    });
    function onResize() { if (zoom > 1) rz.style.width = (baseW() * zoom) + 'px'; }
    window.addEventListener('resize', onResize);
    ov._cleanup = function () { if (io) io.disconnect(); if (far) far.disconnect(); window.removeEventListener('resize', onResize); clearTimeout(tapT); clearTimeout(saveTO); if (m && total) save(); };
  }

  /* ---------- clicks ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target, el;
    if ((el = t.closest('[data-retry]'))) { haptic(); cache.clear(); render(current); return; }
    if ((el = t.closest('[data-mode]'))) { haptic(); setMode(el.dataset.mode); return; }
    if ((el = t.closest('[data-mopen]'))) { haptic(); go({ name: 'mtitle', tab: current && current.tab, slug: el.dataset.mopen }); return; }
    if ((el = t.closest('[data-mread]'))) {
      haptic('medium');
      var ms = current && (current.slug); if (!ms) return;
      go({ name: 'mread', tab: current.tab, slug: ms, key: el.dataset.mread, page: +el.dataset.page || 0 });
      return;
    }
    if ((el = t.closest('[data-mgenre]'))) { haptic(); go({ name: 'mlist', tab: 'mbrowse', genre: el.dataset.mgenre }); return; }
    if ((el = t.closest('[data-open]'))) {
      haptic(); var p = el.dataset.open.split('|');
      var h = hist().find(function (x) { return x.type === p[0] && x.slug === p[1]; });
      var sm = h && h.episode ? String(h.episode).match(/-(\d+)x[\d.]+$/) : null;
      go({ name: 'title', tab: current && current.tab, type: p[0], slug: p[1], season: sm ? +sm[1] : null });
      return;
    }
    if ((el = t.closest('[data-ep]'))) {
      if (el.dataset.off) { toast(MSG.no_video); return; }
      haptic('medium');
      var th = el.querySelector('.th img');
      var ep = { name: 'play', tab: current.tab, episode: el.dataset.ep, meta: current.meta, thumb: th ? th.src : null, pre: lastPre && lastPre.episode === el.dataset.ep ? lastPre : null };
      if (current.name === 'play') go(ep, { replace: true }); else go(ep);
      return;
    }
    if ((el = t.closest('[data-playmovie]'))) { haptic('medium'); go({ name: 'play', tab: current.tab, movie: el.dataset.playmovie, meta: current.meta }); return; }
    if ((el = t.closest('[data-more]'))) {
      haptic(); var m = el.dataset.more.split('|');
      if (m[0] === 'col') { go({ name: 'list', tab: 'movie', type: 'movie', collection: m[1] }); return; }
      if (m[0] === 'lib') { go({ name: 'mlib', tab: 'mlib' }, { root: true }); return; }
      if (m[0] === 'mall') { go({ name: 'mlist', tab: 'mbrowse' }); return; }
      if (m[0] === 'mtype') { go({ name: 'mlist', tab: 'mbrowse', mtype: m[1] }); return; }
      go({ name: 'list', tab: 'home', type: m[0] === 'series' || m[0] === 'movie' ? m[0] : '', genre: m[0] === 'genre' ? m[1] : '' });
      return;
    }
    if ((el = t.closest('[data-genre]'))) { haptic(); go({ name: 'list', tab: 'home', genre: el.dataset.genre }); return; }
    if ((el = t.closest('[data-lang]'))) { haptic(); go({ name: 'list', tab: 'home', lang: el.dataset.lang }); return; }
    if ((el = t.closest('[data-tab-go]'))) { haptic(); if (mode === 'manga') go({ name: 'msearch', tab: 'msearch', focus: true }, { root: true }); else go({ name: 'search', tab: 'search', focus: true }, { root: true }); }
  });
  nav.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-tab]'); if (!b) return;
    haptic(); var tab = b.dataset.tab;
    if (tab === 'mhome') go({ name: 'mhome', tab: 'mhome' }, { root: true });
    else if (tab === 'msearch') go({ name: 'msearch', tab: 'msearch', focus: true }, { root: true });
    else if (tab === 'mbrowse') go({ name: 'mlist', tab: 'mbrowse' }, { root: true });
    else if (tab === 'mlib') go({ name: 'mlib', tab: 'mlib' }, { root: true });
    else if (tab === 'home') go({ name: 'home', tab: 'home' }, { root: true });
    else if (tab === 'search') go({ name: 'search', tab: 'search', focus: true }, { root: true });
    else go({ name: 'list', tab: tab, type: tab }, { root: true });
  });

  if (!initData) {
    nav.classList.add('hidden');
    app.innerHTML = LOGO.replace(/<button[\s\S]*?<\/button>/, '') + empty('Open in Telegram', 'This app only works inside Telegram. Open the bot and tap "Watch Anime".');
    return;
  }
  buildNav();
  go(mode === 'manga' ? { name: 'mhome', tab: 'mhome' } : { name: 'home', tab: 'home' }, { root: true });
  var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^(series|movie)_[\w-]+$/.test(sp)) { var i = sp.indexOf('_'); go({ name: 'title', tab: 'home', type: sp.slice(0, i), slug: sp.slice(i + 1) }); }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Infinite Animes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<style>
:root{
  --bg:#000; --panel:#111; --panel2:#1a1a1a; --line:#2a2a2a; --text:#fff; --dim:#9a9a9a; --on:#000;
  --pad:16px; --r:12px;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font)}
body{min-height:100vh;overscroll-behavior-y:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
#app{max-width:760px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* header */
.logo{display:flex;align-items:center;gap:10px;padding:16px var(--pad) 8px}
.mark{width:36px;height:36px;border-radius:10px;background:#fff;color:#000;display:grid;place-items:center}
.mark svg{width:24px;height:24px}
.wm{font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo .sbtn{margin-left:auto;width:42px;height:42px;border-radius:999px;background:var(--panel);display:grid;place-items:center}
.logo .sbtn svg{width:20px;height:20px}

/* language picker */
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px var(--pad) 0}
.lang{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;text-align:center;min-height:52px}
.lang b{display:block;font-size:13px;font-weight:700}
.lang small{display:block;color:var(--dim);font-size:11px;line-height:1.3}

/* hero */
.hero{position:relative;margin:16px var(--pad) 0;border-radius:16px;overflow:hidden;min-height:200px;display:flex;align-items:flex-end;background:var(--panel)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.92))}
.hero .in{position:relative;z-index:1;padding:16px}
.hero .tag{color:var(--dim);font-size:13px;font-weight:600}
.hero h1{margin:2px 0 10px;font-size:24px;line-height:1.1;font-weight:800}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15px}
.btn.white{background:#fff;color:#000}
.btn.dark{background:var(--panel2);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.35}

/* section heading */
.sh{display:flex;align-items:center;gap:10px;padding:24px var(--pad) 12px}
.sh h2{margin:0;font-size:21px;font-weight:800;line-height:1.1}
.sh .bar{width:4px;height:22px;border-radius:4px;background:#fff}
.sh .more{margin-left:auto;color:var(--dim);font-size:14px;font-weight:600;padding:6px 0 6px 10px}

/* poster grid + strip */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;padding:0 var(--pad)}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip{display:flex;gap:12px;overflow-x:auto;padding:0 var(--pad);scroll-padding-inline:var(--pad);scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{width:112px;flex:none;scroll-snap-align:start}
.card{display:flex;flex-direction:column;align-self:flex-start;min-width:0;text-align:center}
.pimg{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--panel)}
.pimg img,.th img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.pimg img.ok,.th img.ok{opacity:1}
.pimg .fb{position:absolute;inset:0;display:grid;place-items:center;padding:8px;font-size:13px;font-weight:700;color:var(--dim)}
.pimg .badge{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.8);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:1}
.card .t{font-size:13px;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 var(--pad);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip small{color:var(--dim);margin-left:5px;font-weight:500}
.chip.on small{color:#555}

/* page heading */
.ph{padding:20px var(--pad) 14px}
.ph h1{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:4px;height:26px;border-radius:4px;background:#fff}
.ph p{margin:4px 0 0 14px;color:var(--dim);font-size:14px}
.sorts{margin-bottom:16px}
.sentinel{height:60px}

/* search */
.searchbar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);padding:12px var(--pad)}
.sbox{display:flex;align-items:center;gap:10px;height:48px;border:1.5px solid #fff;border-radius:999px;padding:0 18px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:500 16px var(--font)}
.sbox input::placeholder{color:var(--dim)}
.sbox svg{width:20px;height:20px;flex:none}

/* title page */
.tpage{position:relative}
.tbg{position:absolute;top:0;left:0;right:0;height:380px;background:center 30%/cover no-repeat;opacity:.35;filter:blur(14px);transform:scale(1.1)}
.tbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),#000 95%)}
.tposter{position:relative;width:170px;margin:28px auto 0;box-shadow:0 16px 40px rgba(0,0,0,.7)}
.ttl{position:relative;text-align:center;font-size:24px;font-weight:800;line-height:1.15;margin:16px var(--pad) 14px}
.two{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 var(--pad)}
.ob{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px}
.ob.white{background:#fff;color:#000;border-color:#fff}
.ob svg{width:18px;height:18px;flex:none}
.ob span{display:flex;flex-direction:column;text-align:left;line-height:1.25}
.ob b{font-size:14px}.ob small{font-size:12px;opacity:.7}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:14px var(--pad) 0}
.pills span{background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:#ddd}
.box{margin:14px var(--pad) 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 6px;font-size:17px;font-weight:800}
.box p{margin:0;color:#c8c8c8;font-size:14px;line-height:1.6}
.box p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rm{font-weight:700;font-size:14px;padding:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tags span{border:1px solid #444;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.box h4{margin:14px 0 0;font-size:14px;font-weight:700}
.seasons{padding-top:18px}
.season{flex:none;height:44px;padding:0 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--dim);white-space:nowrap}
.season.on{color:#fff;border-color:#fff}
.season small{font-weight:500;margin-left:4px}

/* episodes grid */
.eps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;padding:14px var(--pad) 0}
@media (min-width:560px){.eps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ep{text-align:left;min-width:0;display:flex;flex-direction:column;align-self:flex-start}
.th{position:relative;width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--panel)}
.th .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.8);font-size:12px;font-weight:800;padding:2px 7px;border-radius:5px;z-index:1}
.ep .et{font-size:12px;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.off{opacity:.35}
.ep.now .th{outline:2px solid #fff;outline-offset:-2px}
.note{color:var(--dim);font-size:14px;padding:12px var(--pad) 0;margin:0}
.relink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--fg,#fff);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* player */
.player{position:sticky;top:0;z-index:15;background:#000}
.player .stage{position:relative}
.player .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:14px}
.fsbtn{position:absolute;right:8px;top:8px;z-index:3;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.55);display:grid;place-items:center}
.fsbtn svg{width:20px;height:20px}
.fsbar{display:none}
/* full screen: poori screen, portrait phone pe 90 degree ghuma ke landscape */
.player.fs{position:fixed;inset:0;z-index:100;background:#000}
.player.fs .stage{position:absolute;left:50%;top:50%;transform-origin:center center}
.player.fs .frame{aspect-ratio:auto;width:100%;height:100%}
.player.fs iframe{inset:auto}
.player.fs .fsbtn{display:none}
.player.fs .fsbar{display:flex;gap:8px;position:absolute;right:12px;top:12px;z-index:3;transition:opacity .3s}
.player.fs .fsbar.dim{opacity:.25}
.fsbar button{height:38px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.fsbar svg{width:16px;height:16px}
body.lock{overflow:hidden}
.pinfo{padding:14px var(--pad) 0}
.pinfo h1{margin:0;font-size:20px;font-weight:800;line-height:1.2}
.pinfo .lbl{color:var(--dim);font-size:14px;margin-top:3px}
.ctrl{display:flex;gap:10px;margin:14px var(--pad) 0}
.ctrl .btn{flex:1}
.servers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 var(--pad)}
.srv{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px;text-align:center}
.srv b{display:block;font-size:14px;font-weight:800}
.srv small{color:var(--dim);font-size:12px}
.srv.on{border-color:#fff;background:#fff;color:#000}
.srv.on small{color:#444}

/* skeleton */
.sk{background:linear-gradient(90deg,#111 0,#1d1d1d 50%,#111 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.skt{height:12px;border-radius:6px;margin-top:8px}

/* empty */
.empty{padding:56px var(--pad);text-align:center;color:var(--dim)}
.empty h2{color:#fff;font-size:20px;margin:0 0 6px}
.empty .btn{margin-top:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#777;font-size:11px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff}

/* toast + sheet */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#fff;color:#000;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);display:grid;place-items:end center;padding:16px}
.sheet{width:100%;max-width:420px;background:#111;border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px}
.sheet h2{margin:0 0 8px;font-size:22px}
.sheet p{color:#c8c8c8;margin:0 0 16px;font-size:15px}
.sheet .btn{width:100%;margin-top:8px}

/* ---------- intro (plays when the app opens) ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#000;overflow:hidden;contain:strict;will-change:transform}
#intro .spot{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 85% 46% at 50% 44%,rgba(255,255,255,.17) 0%,rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 74%)}
#intro .floor{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22) 50%,rgba(255,255,255,0));opacity:0}
#intro .floor:after{content:"";position:absolute;left:10%;right:10%;top:0;height:60px;background:radial-gradient(ellipse 50% 100% at 50% 0,rgba(255,255,255,.1),rgba(255,255,255,0) 70%)}
#intro .logo{position:absolute;left:50%;top:31%;width:min(56vw,300px);aspect-ratio:720/440;transform:translate(-50%,-50%)}
#intro svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#intro path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#intro .halo{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;margin:-95% 0 0 -95%;opacity:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.36) 0%,rgba(255,255,255,.1) 34%,rgba(255,255,255,0) 66%);will-change:transform,opacity}
#intro .rim{stroke:#fff;stroke-width:64;opacity:0}
#intro .tube{stroke:#181818;stroke-width:57;opacity:0}
#intro .lit{stroke:url(#ing);stroke-width:58;opacity:0}
#intro .glow{filter:blur(16px);opacity:0;will-change:opacity}
#intro .glow path{stroke:#fff;stroke-width:62}
#intro .flare{position:absolute;left:50%;top:50%;width:300%;height:3px;margin:-1.5px 0 0 -150%;border-radius:3px;opacity:0;will-change:transform,opacity;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95) 50%,rgba(255,255,255,0));box-shadow:0 0 22px 5px rgba(255,255,255,.4)}
#intro .flash{position:absolute;inset:0;background:#fff;opacity:0}
#intro .word{position:absolute;left:0;right:0;top:54%;text-align:center;font-weight:800;font-size:min(11.5vw,54px);letter-spacing:-.02em;white-space:nowrap;line-height:1;color:#c4c4c4;opacity:0;will-change:transform,opacity}
#intro .word span{display:inline-block;transform-origin:50% 100%}
#intro .word .bl{width:0;height:0}
#intro .shim{color:transparent;opacity:1;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(105deg,rgba(255,255,255,0) 42%,#fff 50%,rgba(255,255,255,0) 58%);background-size:300% 100%;background-position:130% 0;background-repeat:no-repeat}
#intro .beam{position:absolute;top:-20%;left:0;width:34%;height:140%;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.13) 50%,rgba(255,255,255,0));will-change:transform,opacity}
#intro .abs{position:absolute;left:0;top:0;will-change:transform,opacity}
#intro .shadow{border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.9),rgba(0,0,0,0) 70%),radial-gradient(ellipse,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}
#intro .puff{border-radius:50%;background:rgba(255,255,255,.5);opacity:0}
#intro .ring{border-radius:50%;border:2px solid #ffe2a6;opacity:0}
#intro .orb{border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff 0%,#fff 46%,#ffe9bd 100%)}
#intro .orb u{position:absolute;inset:-190%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,130,.85) 0%,rgba(255,190,90,.34) 30%,rgba(255,180,80,0) 66%);will-change:opacity,transform}
#intro .sq{position:absolute;inset:0;transform-origin:50% 100%;will-change:transform}
#intro .bd{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 36% 28%,#fff 0%,#f2f2f2 38%,#b9b9b9 82%,#8f8f8f 100%);box-shadow:inset -3px -5px 9px rgba(0,0,0,.22),0 0 16px rgba(255,255,255,.22)}
#intro .eye{position:absolute;top:33%;width:15%;height:23%;border-radius:50%;background:#0b0b0b;will-change:transform}
#intro .eye:after{content:"";position:absolute;left:22%;top:14%;width:34%;height:30%;border-radius:50%;background:#fff}
#intro .eye.l{left:27%}#intro .eye.r{left:58%}
#intro .arm{position:absolute;top:42%;width:13%;height:44%;border-radius:45%;background:linear-gradient(#ececec,#a9a9a9);transform-origin:50% 12%;will-change:transform}
#intro .arm.l{left:-3%}#intro .arm.r{right:-3%}
#intro .foot{position:absolute;bottom:-7%;width:27%;height:15%;border-radius:50% 50% 42% 42%;background:#9d9d9d;will-change:transform}
#intro .foot.l{left:16%}#intro .foot.r{right:16%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="spot"></div><div class="floor" id="inFloor"></div>
  <div class="logo" id="inLogo">
    <div class="halo"></div>
    <svg class="glow" viewBox="-360 -220 720 440"><path class="ip"/></svg>
    <svg viewBox="-360 -220 720 440"><defs><linearGradient id="ing" x1="0" y1="-150" x2="0" y2="150" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dcdcdc"/><stop offset="1" stop-color="#858585"/></linearGradient></defs>
      <path class="ip rim r1"/><path class="ip rim r2"/><path class="ip tube"/><path class="ip lit"/></svg>
    <div class="flare"></div>
  </div>
  <div class="word" id="inWord"></div><div class="word shim" id="inShim"></div>
  <div class="beam"></div><div class="flash"></div>
</div>
<script>
/* Intro (5 s): a little helper carries a glowing dot in and puts it on the last "i" of the name.
   To change the name: edit NAME below (the LAST lowercase "i" is the one that gets its dot).
   Motion and sound are both made in the browser: no video, no audio file. */
(function () {
  var NAME = 'Infinite Animes', ONCE_PER_SESSION = true;
  var el = document.getElementById('intro');
  if (!el) return;
  var tg = window.Telegram && window.Telegram.WebApp, seen = false;
  try { seen = ONCE_PER_SESSION && sessionStorage.getItem('ia_intro') === '1'; sessionStorage.setItem('ia_intro', '1'); } catch (e) {}
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!tg || !tg.initData || calm || seen || !el.animate) { el.remove(); return; }

  var DUR = 5000, T_IN = 1000, T_STOP = 1650, T_CROUCH = 1900, T_JUMP = 2100, T_PLACE = 2450, T_LAND = 2800, T_SHINE = 3500, T_BYE = 3900, T_UP = 4350;
  var W = window.innerWidth;
  function q(sel) { return el.querySelector(sel); }
  function A(node, frames, o) { o.fill = 'both'; return node.animate(frames, o); }
  function C(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function P(t, a, b) { return C((t - a) / (b - a)); }
  function eo(x) { return 1 - Math.pow(1 - x, 3); }
  function ei(x) { return x * x * x; }
  function io(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function bump(t, a, pk, b) { return t <= a || t >= b ? 0 : t < pk ? io((t - a) / (pk - a)) : 1 - io((t - pk) / (b - pk)); }
  function spring(x) { return 1 - Math.exp(-6 * x) * Math.cos(11 * x); }
  // bake a function of time into keyframes so the browser animates it on the compositor
  function bake(node, fn) { var f = [], n = DUR / 1000 * 60, k; for (k = 0; k <= n; k++) f.push(fn(k / n * DUR)); return node.animate(f, { duration: DUR, fill: 'both', easing: 'linear' }); }
  function add(cls, w, h, html) { var n = document.createElement('div'); n.className = 'abs ' + cls; n.style.width = w + 'px'; n.style.height = (h || w) + 'px'; if (html) n.innerHTML = html; el.insertBefore(n, q('.beam')); return n; }

  /* name: every i keeps its dot except the last one */
  var wordEl = document.getElementById('inWord'), shim = document.getElementById('inShim'), last = NAME.lastIndexOf('i'), iSpan = null, i;
  for (i = 0; i < NAME.length; i++) {
    var sp = document.createElement('span'), ch = NAME[i];
    sp.textContent = ch === ' ' ? ' ' : (i === last ? 'ı' : ch);
    if (i === last) iSpan = sp;
    wordEl.appendChild(sp);
  }
  shim.textContent = NAME.slice(0, last) + 'ı' + NAME.slice(last + 1);
  var bl = document.createElement('span'); bl.className = 'bl'; wordEl.appendChild(bl);
  var fs = parseFloat(getComputedStyle(wordEl).fontSize), base = bl.getBoundingClientRect().top;

      var html = '<div class="pinfo"><h1>' + esc(st.title) + '</h1>' + (r.episode ? '<div class="lbl">' + esc(st.label) + '</div>' : '') + '</div>';
      if (r.episode) html += '<div class="ctrl"><button class="btn dark" data-nav="prev"' + (st.prev ? '' : ' disabled') + '>' + ICON.prev + 'Previous</button>' +
        '<button class="btn white" data-nav="next"' + (st.next ? '' : ' disabled') + '>Next' + ICON.next + '</button></div>';
      html += heading('Select server') + '<div class="servers" id="srv">' + st.options.map(function (o) {
        return '<button class="srv' + (o.n === n ? ' on' : '') + '" data-opt="' + o.n + '"><b>Server ' + (o.n + 1) + '</b><small>' + esc(o.label || '') + '</small></button>';
      }).join('') + '</div><p class="note">Video stuck? <button class="relink" data-reload="1">Reload</button> or try another server.</p>';
      if (r.meta && r.meta.type === 'series') html += '<div id="more"></div>';
      document.getElementById('pbody').innerHTML = html;
    }
    function seasonGrid() {
      if (!r.meta || r.meta.type !== 'series' || !r.episode) return;
      getTitle('series', r.meta.slug).then(function (t) {
        if (!alive() || !t.seasons.length) return;
        var m = r.episode.match(/-(\d+)x[\d.]+$/);
        r.season = m ? +m[1] : t.seasons[0].season;
        document.getElementById('more').innerHTML = heading('Episodes') + seasonsHtml(t, r.season);
        bindSeasons(t, r, alive, r.episode);
      }).catch(function () {});
    }
    fetchPlay().then(function (d) {
      if (!alive()) return;
      frame(); info(); seasonGrid();
      if (r.meta) hist({ type: r.meta.type, slug: r.meta.slug, title: r.meta.title, poster: r.meta.poster, episode: r.episode || null, label: r.episode ? (d.label || '').split(' · ')[0] : '' });
    }).catch(function (e) {
      if (!alive() || gate(e, r, alive)) return;
      app.innerHTML = empty('Video not available', errMsg(e), e.code === 'slow_down');
    });
    app.addEventListener('click', function (ev) {
      if (!alive() || !st) return;
      var b = ev.target.closest('[data-opt],[data-reload]');
      if (b) {
        // same server dobara tap karo ya Reload dabao = video dobara load
        haptic(); if (b.dataset.opt != null) { opt = +b.dataset.opt; ls('opt', opt); }
        var fresh = Date.now() - st.at < (st.expires_in - 20) * 1000;
        mark();
        (fresh ? Promise.resolve() : fetchPlay()).then(function () { if (alive()) { frame(); mark(); } }).catch(function (e) { toast(errMsg(e)); });
        return;
      }
      var n = ev.target.closest('[data-nav]');
      if (n && st[n.dataset.nav]) { haptic('medium'); if (fsExit) exitFs(); go({ name: 'play', tab: r.tab, episode: st[n.dataset.nav], meta: r.meta }, { replace: true }); }
    });
  }

  /* ---------- clicks ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target, el;
    if ((el = t.closest('[data-retry]'))) { haptic(); cache.clear(); render(current); return; }
    if ((el = t.closest('[data-open]'))) {
      haptic(); var p = el.dataset.open.split('|');
      var h = hist().find(function (x) { return x.type === p[0] && x.slug === p[1]; });
      var sm = h && h.episode ? String(h.episode).match(/-(\d+)x[\d.]+$/) : null;
      go({ name: 'title', tab: current && current.tab, type: p[0], slug: p[1], season: sm ? +sm[1] : null });
      return;
    }
    if ((el = t.closest('[data-ep]'))) {
      if (el.dataset.off) { toast(MSG.no_video); return; }
      haptic('medium');
      var ep = { name: 'play', tab: current.tab, episode: el.dataset.ep, meta: current.meta };
      if (current.name === 'play') go(ep, { replace: true }); else go(ep);
      return;
    }
    if ((el = t.closest('[data-playmovie]'))) { haptic('medium'); go({ name: 'play', tab: current.tab, movie: el.dataset.playmovie, meta: current.meta }); return; }
    if ((el = t.closest('[data-more]'))) {
      haptic(); var m = el.dataset.more.split('|');
      go({ name: 'list', tab: 'home', type: m[0] === 'series' || m[0] === 'movie' ? m[0] : '', genre: m[0] === 'genre' ? m[1] : '' });
      return;
    }
    if ((el = t.closest('[data-genre]'))) { haptic(); go({ name: 'list', tab: 'home', genre: el.dataset.genre }); return; }
    if ((el = t.closest('[data-lang]'))) { haptic(); go({ name: 'list', tab: 'home', lang: el.dataset.lang }); return; }
    if ((el = t.closest('[data-tab-go]'))) { haptic(); go({ name: 'search', tab: 'search', focus: true }, { root: true }); }
  });
  nav.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-tab]'); if (!b) return;
    haptic(); var tab = b.dataset.tab;
    if (tab === 'home') go({ name: 'home', tab: 'home' }, { root: true });
    else if (tab === 'search') go({ name: 'search', tab: 'search', focus: true }, { root: true });
    else go({ name: 'list', tab: tab, type: tab }, { root: true });
  });

  if (!initData) {
    nav.classList.add('hidden');
    app.innerHTML = LOGO.replace(/<button[\s\S]*?<\/button>/, '') + empty('Open in Telegram', 'This app only works inside Telegram. Open the bot and tap "Watch Anime".');
    return;
  }
  go({ name: 'home', tab: 'home' }, { root: true });
  var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^(series|movie)_[\w-]+$/.test(sp)) { var i = sp.indexOf('_'); go({ name: 'title', tab: 'home', type: sp.slice(0, i), slug: sp.slice(i + 1) }); }
})();
</script>
</body>
</html>
